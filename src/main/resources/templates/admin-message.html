<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Admin-Contact Message</title>
<link rel="stylesheet" type="text/css" th:href="@{/admin-message.css}">
</head>
<body> 
	<header class="navbar"> 
		<div class="symbol"> 
			<div class="symbol-container"></div> 
				<div class="brand-text">
					 <h1 class="brand">Maii Construction and Developers</h1>
					      <p class="tagline">Structural Engineering</p>
				</div>
			 </div>
			 <nav>
			 	 <ul class="nav-links"> 
			 	 	<a href="/home">Home</a>
			 	 	<a href="/openAbout">About</a>
			 	 	<a href="/contact">Contact</a> 
			 	 	<a href="/openProject">Projects</a> 
			 	 	<a href="/openService">Services</a> 
			 	 	
			 	 </ul>
			 </nav> 
	</header>
	  <h2>All Contact Form Submissions</h2>

    <table class="admin-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone Number</th>
                <th>Email</th>
                <th>Message</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="msg : ${messages}">
                <td th:text="${msg.id}"></td>
                <td th:text="${msg.name}"></td>
                <td th:text="${msg.phoneNumber}"></td>
                <td th:text="${msg.email}"></td>
                <td th:text="${msg.message}"></td>
            </tr>
        </tbody>
    </table>
    <div class="logout-container"> 
    	<form th:action="@{/logout}" method="post" style="text-align: right; margin: 20px;">
    		<button type="submit" class="logout-btn">Logout</button>
		</form>
	</div>
    
</body>
</html>
